name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The .NET 10 SDK builds every target framework; the 8.0 and 9.0 SDKs are
      # installed so their runtimes are present for running the multi-targeted tests.
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Cachemix.slnx

      - name: Build
        run: dotnet build Cachemix.slnx --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test Cachemix.slnx
          --configuration Release
          --no-build
          --verbosity normal
          --collect "XPlat Code Coverage"
